services:
  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:?Set the public HTTPS application domain}
      # Better Auth runs in the NestJS API; /api/auth/* is relayed there (no secret in this service).
      AUTH_API_URL: http://vortex-api:3001
      FRONTEND_API_URL: http://vortex-api:3001/api/v1
    networks: [apps, dokploy]
    expose: ["3000"]
    read_only: true
    tmpfs: [/tmp, "/app/.next/cache:uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  apps:
    external: true
    name: ${VORTEX_NETWORK:-vortex-internal}
  dokploy:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
